{{- if .Values.valkey.enabled }}
{{- $name := printf "%s-valkey" (include "alga.fullname" .) }}
{{- $password := required "valkey.auth.password is required when valkey.enabled is true" .Values.valkey.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "alga.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  # Config file mounted into the server so the password never appears in
  # process arguments.
  valkey.conf: {{ printf "requirepass %s\ndir /data\n" $password | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "alga.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    app.kubernetes.io/name: {{ include "alga.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "alga.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "alga.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "alga.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ $name }}
            items:
              - key: valkey.conf
                path: valkey.conf
        {{- if not .Values.valkey.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.valkey.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.valkey.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.valkey.persistence.size }}
  {{- end }}
{{- end }}
