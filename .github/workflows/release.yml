# Release workflow — builds immutable artifacts on version tags (ASVS V14).
# Triggered by pushing a `v*` tag.
#
# Tag format: `v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]` (Semantic Versioning).
# Examples: v0.1.0, v1.0.0-rc.1.
#
# Produces:
#   - Docker images for backend and frontend, tagged with:
#       latest, <version>, <commit-sha>  (pushed to GHCR only)
#   - Backend binary (linux/amd64) as a release asset
#   - SHA256 checksums file
#   - GitHub Release with auto-generated notes
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release and upload assets
  packages: write   # push to GHCR
  id-token: write   # for OIDC keyless signing (future)

env:
  GO_VERSION: "1.26.5"
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────── Metadata ──────────────────────────────
  meta:
    name: Release · Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
    steps:
      - name: Parse SemVer tag
        id: semver
        run: |
          # Tag is pushed as refs/tags/v<MAJOR>.<MINOR>.<PATCH>[-<pre>][+<build>]
          TAG="${GITHUB_REF_NAME#v}"
          if ! echo "$TAG" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: '$TAG' is not valid SemVer" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # A prerelease has a hyphen after the patch version.
          if echo "$TAG" | grep -q '-'; then
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────── Backend binary ────────────────────────
  backend-binaries:
    name: Release · Backend Binary
    runs-on: ubuntu-latest
    needs: [meta]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum
      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('apps/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-
      - name: Build backend (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        # -X main.version is a no-op until a `var version string` exists in
        # apps/backend/main.go; harmless otherwise.
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ needs.meta.outputs.version }}" \
            -o /tmp/alga-${{ needs.meta.outputs.version }}-linux-amd64 .
      - name: Upload backend binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-binary
          path: /tmp/alga-${{ needs.meta.outputs.version }}-linux-amd64

  # ─────────────────────────────── Docker images ─────────────────────────
  docker-images:
    name: Release · Docker Images
    runs-on: ubuntu-latest
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend context is the repo root so the Dockerfile can read
          # apps/backend/ source. The Mattermost plugin is not bundled into
          # the image — it ships as a separate release asset (plugin-release.yml).
          - target: backend
            context: .
            dockerfile: apps/backend/Dockerfile
          - target: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract lowercase repo name
        id: repo
        run: |
          repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${repo_lc}" >> "$GITHUB_OUTPUT"
      - name: Build & push ${{ matrix.target }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-${{ matrix.target }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-${{ matrix.target }}:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-${{ matrix.target }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

  # ─────────────────────────────── GitHub Release ────────────────────────
  github-release:
    name: Release · GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, backend-binaries, docker-images]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Download backend binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: backend-binary
          path: /tmp/release
      - name: Generate SHA256 checksums
        working-directory: /tmp/release
        run: |
          sha256sum ./* > "checksums-${{ needs.meta.outputs.version }}.txt"
          cat "checksums-${{ needs.meta.outputs.version }}.txt"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            /tmp/release/*
          body: |
            ## Alga ${{ github.ref_name }}

            ### Docker images

            Published to `${{ env.REGISTRY }}/${{ github.repository }}`:

            | Image | Tag |
            |-------|-----|
            | backend | `${{ needs.meta.outputs.version }}` |
            | frontend | `${{ needs.meta.outputs.version }}` |

            Pull with an immutable tag:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/alga-backend:${{ needs.meta.outputs.version }}
            ```

            ### Backend binary

            `alga` for `linux/amd64`, with SHA256 checksums attached.

            ### Verification

            ```bash
            sha256sum -c checksums-${{ needs.meta.outputs.version }}.txt
            ```
          draft: false
