language: go

tasks:
  build:
    command: go build -ldflags '-s -w' -o alga-agent .
  vet:
    command: go vet ./...
  format:
    command: gofmt -l .
  format-write:
    command: gofmt -w .
    options:
      runInCI: false
  test:
    command: go test ./...
  run:
    command: go run .
    options:
      runInCI: false
      persistent: true
