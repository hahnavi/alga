# Release workflow — builds immutable artifacts on version tags (ASVS V14).
# Triggered by pushing a `v*` tag.
#
# Tag format: `v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]` (Semantic Versioning).
# Examples: v0.1.0, v1.0.0-rc.1.
#
# Produces:
#   - Docker images for backend and frontend, tagged with:
#       latest, <version>, <commit-sha>  (pushed to GHCR only)
#   - GitHub Release with auto-generated notes
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR
  id-token: write   # for OIDC keyless signing (future)

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────── Metadata ──────────────────────────────
  meta:
    name: Release · Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
    steps:
      - name: Parse SemVer tag
        id: semver
        run: |
          # Tag is pushed as refs/tags/v<MAJOR>.<MINOR>.<PATCH>[-<pre>][+<build>]
          TAG="${GITHUB_REF_NAME#v}"
          if ! echo "$TAG" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: '$TAG' is not valid SemVer" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # A prerelease has a hyphen after the patch version.
          if echo "$TAG" | grep -q '-'; then
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────── Docker images ─────────────────────────
  docker-images:
    name: Release · Docker Images
    runs-on: ubuntu-latest
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend context is the repo root so the Dockerfile can read
          # apps/backend/ source. The Mattermost plugin is not bundled into
          # the image — it ships as a separate release asset (plugin-release.yml).
          - target: backend
            context: .
            dockerfile: apps/backend/Dockerfile
          - target: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c  # v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract lowercase owner name
        id: repo
        run: |
          owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${owner_lc}" >> "$GITHUB_OUTPUT"
      - name: Build & push ${{ matrix.target }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-${{ matrix.target }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-${{ matrix.target }}:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-${{ matrix.target }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

  # ─────────────────────────────── GitHub Release ────────────────────────
  github-release:
    name: Release · GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, docker-images]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Alga ${{ github.ref_name }}

            ### Docker images

            Published to `${{ env.REGISTRY }}/${{ github.repository_owner }}`:

            | Image | Tag |
            |-------|-----|
            | backend | `${{ needs.meta.outputs.version }}` |
            | frontend | `${{ needs.meta.outputs.version }}` |

            Pull with an immutable tag:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/alga-backend:${{ needs.meta.outputs.version }}
            ```
          draft: false
