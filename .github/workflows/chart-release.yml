# Helm chart release workflow — publishes the chart to GHCR as an OCI artifact.
# Triggered by pushing a `chart-v*` tag. The chart is versioned independently
# of the application (`v*` tags, release.yml).
#
# Tag format: `chart-v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]` and must match
# the `version` field in deploy/charts/alga/Chart.yaml.
# Examples: chart-v0.1.0, chart-v0.2.0-rc.1.
name: Chart Release

on:
  push:
    tags:
      - "chart-v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CHART_DIR: deploy/charts/alga

jobs:
  # ─────────────────────────────── Metadata ──────────────────────────────
  meta:
    name: Chart · Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
    steps:
      - name: Parse SemVer tag
        id: semver
        run: |
          # Tag is pushed as refs/tags/chart-v<MAJOR>.<MINOR>.<PATCH>[-<pre>][+<build>]
          TAG="${GITHUB_REF_NAME#chart-v}"
          if ! echo "$TAG" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: '$TAG' is not valid SemVer" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # A prerelease has a hyphen after the patch version. Strip build
          # metadata first so hyphens in `+<build>` don't count.
          if echo "${TAG%%+*}" | grep -q '-'; then
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────── Helm chart ────────────────────────────
  helm-chart:
    name: Chart · Package & Push
    runs-on: ubuntu-latest
    needs: [meta]
    permissions:
      contents: read    # checkout
      packages: write   # push to GHCR
    outputs:
      owner: ${{ steps.repo.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
      - name: Verify tag matches Chart.yaml version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          CHART_VERSION=$(helm show chart "$CHART_DIR" | awk '/^version:/{print $2}')
          if [ "$CHART_VERSION" != "$VERSION" ]; then
            echo "error: tag version '$VERSION' does not match Chart.yaml version '$CHART_VERSION'" >&2
            exit 1
          fi
      - name: Lint chart
        run: helm lint "$CHART_DIR"
      - name: Extract lowercase owner name
        id: repo
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ${{ env.REGISTRY }} \
            --username "$GHCR_USER" --password-stdin
      - name: Package & push chart
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OWNER: ${{ steps.repo.outputs.name }}
        run: |
          helm package "$CHART_DIR"
          helm push "alga-${VERSION}.tgz" "oci://${{ env.REGISTRY }}/${OWNER}/charts"

  # ─────────────────────────────── GitHub Release ────────────────────────
  github-release:
    name: Chart · GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, helm-chart]
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Helm Chart ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Alga Helm chart ${{ needs.meta.outputs.version }}

            Published to `${{ env.REGISTRY }}/${{ needs.helm-chart.outputs.owner }}/charts/alga`.

            ```bash
            helm install alga oci://${{ env.REGISTRY }}/${{ needs.helm-chart.outputs.owner }}/charts/alga --version ${{ needs.meta.outputs.version }}
            ```
          draft: false
