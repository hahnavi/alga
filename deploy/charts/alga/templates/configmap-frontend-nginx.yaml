apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alga.fullname" . }}-frontend-nginx
  labels:
    {{- include "alga.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # Overrides the image's /etc/nginx/conf.d/default.conf, which proxies to the
  # docker-compose hostname "backend"; in Kubernetes the backend is reached via
  # the release-scoped Service on port 80.
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 256;
        gzip_vary on;

        location /api/v1/events {
            proxy_pass http://{{ include "alga.fullname" . }}-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
        }

        location /api/ {
            proxy_pass http://{{ include "alga.fullname" . }}-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhooks/ {
            proxy_pass http://{{ include "alga.fullname" . }}-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
