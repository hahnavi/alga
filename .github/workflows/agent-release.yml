# Agent release workflow — builds immutable alga-agent artifacts on agent
# version tags. Triggered by pushing an `agent-v*` tag.
#
# The agent is versioned independently of the application (`v*` tags) and the
# Helm chart (`chart-v*` tags).
#
# Tag format: `agent-v<MAJOR>.<MINOR>.<PATCH>[-<prerelease>]` (Semantic Versioning).
# Examples: agent-v0.0.1, agent-v0.1.0-rc.1.
#
# Produces:
#   - Docker image ghcr.io/<owner>/alga-agent tagged with:
#       latest, v<version>, <commit-sha>
#   - Cross-compiled binaries (linux/darwin × amd64/arm64) with SHA256 checksums
#   - GitHub Release with auto-generated notes
name: Agent Release

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR
  id-token: write   # for OIDC keyless signing (future)

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.26.5"
  GOTOOLCHAIN: local

jobs:
  # ─────────────────────────────── Metadata ──────────────────────────────
  meta:
    name: Agent · Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
    steps:
      - name: Parse SemVer tag
        id: semver
        run: |
          # Tag is pushed as refs/tags/agent-v<MAJOR>.<MINOR>.<PATCH>[-<pre>][+<build>]
          # Validate the bare SemVer but output with v prefix so Docker image
          # tags include it (e.g. v0.0.1), matching the app release convention.
          BARE="${GITHUB_REF_NAME#agent-v}"
          if ! echo "$BARE" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: '$BARE' is not valid SemVer" >&2
            exit 1
          fi
          echo "version=v${BARE}" >> "$GITHUB_OUTPUT"
          # A prerelease has a hyphen after the patch version. Strip build
          # metadata first so hyphens in `+<build>` don't count.
          if echo "${BARE%%+*}" | grep -q '-'; then
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────── Docker image ──────────────────────────
  docker-image:
    name: Agent · Docker Image
    runs-on: ubuntu-latest
    needs: [meta]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract lowercase owner name
        id: repo
        run: |
          owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${owner_lc}" >> "$GITHUB_OUTPUT"
      # Context is the repo root so the Dockerfile can read the local SDK at
      # integrations/alga-agent-sdk-go (built with GOWORK=off).
      - name: Build & push alga-agent
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: apps/alga-agent/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-agent:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-agent:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/alga-agent:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=alga-agent
          cache-to: type=gha,mode=max,scope=alga-agent
          provenance: true
          sbom: true

  # ─────────────────────────────── GitHub Release ────────────────────────
  github-release:
    name: Agent · Binaries & GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, docker-image]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/alga-agent/go.sum
      - name: Build binaries
        working-directory: apps/alga-agent
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X alga-agent/internal/version.Version=${VERSION}" \
              -o "dist/alga-agent-${VERSION}-${GOOS}-${GOARCH}" .
          done
      - name: Generate checksums
        working-directory: apps/alga-agent/dist
        run: sha256sum alga-agent-* > "checksums-agent-${{ needs.meta.outputs.version }}.txt"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Agent ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            apps/alga-agent/dist/alga-agent-*
            apps/alga-agent/dist/checksums-agent-${{ needs.meta.outputs.version }}.txt
          body: |
            ## Alga Agent ${{ needs.meta.outputs.version }}

            ### Docker image

            Published to `${{ env.REGISTRY }}/${{ github.repository_owner }}`:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/alga-agent:${{ needs.meta.outputs.version }}
            ```

            ### Binaries

            Cross-compiled binaries for linux/darwin (amd64/arm64) are attached
            below with SHA256 checksums in `checksums-agent-${{ needs.meta.outputs.version }}.txt`.
          draft: false
