<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alga on-call and incident management" />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      Strict CSP. The SSE/proxy host must be added to `connect-src` at deploy
      time (e.g. via response header). This meta tag covers browsers that
      don't inherit the response CSP during navigation. `unsafe-inline` on
      style-src is required by Tailwind/v-tokens injected styles; revisit if
      the build adopts nonces.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com data:;
               img-src 'self' data: blob:;
               connect-src 'self';
               frame-ancestors 'none';
               base-uri 'self';
               form-action 'self';"
    />
    <title>Alga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This application requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
