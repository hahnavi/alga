# Alga — ready-to-use Docker Compose deployment.
#
# Uses prebuilt images from GitHub Container Registry (no source checkout
# required). Copy this file and .env.example to the target host:
#
#   cp .env.example .env   # then fill in the required secrets
#   docker compose up -d
#
# The UI is served on http://<host>:${ALGA_HTTP_PORT:-3000}; nginx inside the
# frontend image proxies /api, /api/v1/events (SSE) and /webhooks to the
# backend. Put a TLS-terminating reverse proxy in front for production and set
# SECURE_COOKIES=true.

name: alga

services:
  postgres:
    # Backend startup migrations require the pgvector extension.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alga}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set POSTGRES_PASS in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alga}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alga}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alga
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alga
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4.3.3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-alga}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - alga
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/hahnavi/alga-backend:${ALGA_VERSION:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-24}
      POSTGRES_DSN: postgres://${POSTGRES_USER:-alga}:${POSTGRES_PASS}@postgres:5432/${POSTGRES_DB:-alga}?sslmode=disable
      POSTGRES_AUTO_MIGRATE: "true"
      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-alga}:${RABBITMQ_PASS}@rabbitmq:5672/
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS in .env, see .env.example}
      SECRET_PEPPER: ${SECRET_PEPPER:?set SECRET_PEPPER in .env, see .env.example}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - alga
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/hahnavi/alga-frontend:${ALGA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${ALGA_HTTP_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - alga
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  valkey_data:
  rabbitmq_data:

networks:
  alga:
    driver: bridge
