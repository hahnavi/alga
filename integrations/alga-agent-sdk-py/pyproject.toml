[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alga-agent-sdk"
version = "0.3.0"
description = "Python SDK for building AI agents that integrate with the Alga SRE investigation platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
