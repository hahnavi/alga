# CI pipeline — gated secure development lifecycle (ASVS V14).
#
# A lightweight `changes` job detects which areas of the repo were touched and
# gates every downstream job individually. Docs-only PRs run just the docs job
# (future linter); code PRs run the full pipeline. This avoids the all-or-nothing
# problem of `paths-ignore` while still saving runner minutes.
#
# Stages (fail fast): Format & Lint → Tests → Build → Docker Build & Scan,
# with a parallel source/dependency security scan. Jobs run in parallel where
# independent; downstream jobs depend on their upstream gate. Security
# findings block the pipeline (HIGH/CRITICAL) — no `|| true` on scanners that
# gate a merge.
#
# Images are built with `load: true` (loaded into this runner's Docker daemon
# only) so CI never pushes. Publishing happens in release.yml on `v*` tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the exact patch in apps/backend/go.mod (`go 1.27.0`) so setup-go
  # installs a toolchain that already satisfies the module floor. GOTOOLCHAIN=local
  # is the belt-and-suspenders guard: if the pin drifts behind go.mod, Go fails
  # loudly instead of auto-downloading a toolchain into the read-only module cache.
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local
  NODE_VERSION: "26"
  # Keep in sync with `packageManager` in package.json and the pnpm pin in
  # apps/frontend/Dockerfile — pnpm/setup falls back to the `packageManager`
  # version when `version` is omitted, so a partial bump silently splits the
  # toolchain between CI and dev machines.
  PNPM_VERSION: "12.0.0"
  # Pinned to the latest stable release built with Go 1.27 (go1.27.0).
  # golangci-lint can only lint Go versions ≤ its build toolchain, so this must
  # stay ≥ the `go 1.27.0` floor in apps/backend/go.mod. v2.12.2 was built with
  # go1.26 and cannot lint modules targeting Go 1.27.
  GOLANGCI_LINT_VERSION: "v2.13.1"
  # Pinned for the native gosec step in security-scan. The securego/gosec
  # Docker action was dropped because its image ships a fixed Go toolchain that
  # can drift below the `go 1.27.0` floor in go.work; with GOTOOLCHAIN=local
  # that made every package fail to load (0 files scanned). `go install` builds
  # gosec against the runner's own GO_VERSION instead.
  GOSEC_VERSION: "v2.28.0"

jobs:
  # ─────────────────────────────── Change detection ────────────────────────
  # Determines which areas of the repo were touched so downstream jobs can
  # skip when irrelevant. Runs in ~2s (checkout + git diff).
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # Shared infra paths (CI config, compose, deploy, scripts) are
          # inlined into backend AND frontend so that infra changes trigger
          # the full pipeline — nothing is silently skipped.
          filters: |
            backend:
              - "apps/backend/**"
              - "go.work"
              - "go.work.sum"
              - ".github/workflows/**"
              - "docker-compose*.yml"
              - "deploy/**"
              - "scripts/**"
            frontend:
              - "apps/frontend/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/**"
              - "docker-compose*.yml"
              - "deploy/**"
              - "scripts/**"
            docs:
              - "docs/**"
              - "**.md"
              - "LICENSE"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/**"
            plugin:
              - "integrations/alga-hermes-agent-plugin/**"
              - ".github/workflows/**"

  # ─────────────────────────────── Backend: format, lint, vet ────────────
  backend-lint:
    name: Backend · Lint & Format
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum
      - name: Go fmt check (gofmt)
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/backend
          args: ./...

  # ─────────────────────────────── Backend: tests ────────────────────────
  # Runs unit tests plus the `integration`-tagged store suite. The store
  # integration tests spin up ephemeral pgvector containers via testcontainers
  # (Docker is preinstalled on ubuntu-latest) and apply the goose migrations
  # themselves, so no Postgres service is required here. Valkey/RabbitMQ tests
  # use mocks, not live brokers.
  backend-test:
    name: Backend · Unit & Integration
    runs-on: ubuntu-latest
    needs: [changes, backend-lint]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Go
        # setup-go enables module/build caching by default when
        # cache-dependency-path is set (caches ~/go/pkg/mod and
        # ~/.cache/go-build keyed on go.sum). Do NOT add a separate
        # actions/cache step for those paths: Go marks module files
        # read-only, so a second restore over setup-go's already-populated
        # cache makes tar abort with "Cannot open: File exists".
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum
      # Coverage profile is produced here and emitted as a non-gating report
      # below. Per testing-strategy.md §7 the gate is REPORTING-ONLY until the
      # codebase meets the coverage targets (domain >=90%, app >=80%); a failing
      # threshold is intentionally NOT set so existing CI cannot red-break.
      - name: Go test (race + coverage, incl. integration)
        run: go test -tags integration -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage report (non-gating)
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "=== Total coverage ==="
            go tool cover -func=coverage.out | tail -1
            echo "=== Per-package coverage (sorted) ==="
            go test -cover ./... | grep -E '^(ok|FAIL|---)' | sort -t'	' -k2 -n || true
            echo "Coverage targets (goals, not enforced): domain >=90%, app >=80%"
          else
            echo "coverage.out not produced; skipping report"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-coverage
          path: apps/backend/coverage.out
          retention-days: 14

  # ─────────────────────────────── Backend: build ────────────────────────
  backend-build:
    name: Backend · Build
    runs-on: ubuntu-latest
    needs: [changes, backend-lint]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum
      - name: Build backend
        run: go build -trimpath -ldflags="-s -w" -o /tmp/alga .

  # ─────────────────────────────── Frontend: lint & format ───────────────
  frontend-lint:
    name: Frontend · Lint & Format
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b  # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        run: pnpm --filter frontend lint
      - name: Format check (oxfmt)
        run: pnpm --filter frontend format

  # ─────────────────────────────── Frontend: build ───────────────────────
  frontend-build:
    name: Frontend · Build
    runs-on: ubuntu-latest
    needs: [changes, frontend-lint]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b  # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter frontend typecheck
      - name: Unit tests (Vitest)
        run: pnpm --filter frontend test
      - name: Build
        run: pnpm --filter frontend build

  # ─────────────────────────────── Docker build + image scan ─────────────
  # Images are built with `load: true`, which loads them into THIS runner's
  # Docker daemon only — they do NOT transfer to other jobs (each job starts
  # on a fresh runner). The Trivy image scans therefore run in the SAME job,
  # right after the builds. CI never pushes; release.yml publishes on tags.
  docker-build:
    name: Docker · Build & Scan Images
    runs-on: ubuntu-latest
    needs: [changes, backend-build, frontend-build]
    if: |
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      needs.backend-build.result != 'failure' && needs.backend-build.result != 'cancelled' &&
      needs.frontend-build.result != 'failure' && needs.frontend-build.result != 'cancelled'
    permissions:
      contents: read
      actions: read          # upload-sarif reads run metadata
      security-events: write # upload-sarif → Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          tags: alga-backend:ci
          load: true
          # The runtime-base apk-upgrade layer must never be served from a
          # stale cache: a cached layer pins base packages to its build date,
          # so a new advisory against them fails the Trivy gate even though
          # fixed packages are already in the Alpine repo.
          no-cache-filters: runtime-base
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: apps/frontend/Dockerfile
          tags: alga-frontend:ci
          load: true
          # Same rationale as the backend: keep the runtime apk-upgrade layer
          # out of the layer cache (stage named `runtime` in the Dockerfile).
          no-cache-filters: runtime
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ── Container image scanning (Trivy) ──
      # Pinned to the immutable commit SHA of v0.35.0, the safe release
      # following the March 2026 trivy-action supply-chain compromise where
      # mutable tags were force-pushed. Do NOT switch to a floating tag.
      # (GHSA-69fq-xp46-6x23)
      #
      # Two passes per image:
      #   1. SARIF (exit-code 0) — trivy-action ignores `severity` in SARIF
      #      mode and scans ALL severities for the Security tab. exit-code 0
      #      keeps it non-blocking so MEDIUM/UNKNOWN are reported, not fatal.
      #   2. Blocking gate (table, HIGH/CRITICAL, exit-code 1) — the real
      #      ASVS V14 gate. Only HIGH/CRITICAL fail the pipeline.

      # ── Pass 1: SARIF reports (non-blocking, all severities) ──
      - name: Trivy backend image → SARIF
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: alga-backend:ci
          format: sarif
          output: trivy-backend-results.sarif
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Trivy frontend image → SARIF
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: alga-frontend:ci
          format: sarif
          output: trivy-frontend-results.sarif
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Upload Trivy backend SARIF
        # Non-fatal: code scanning (GHAS) is unavailable on free private
        # repos, so the upload is rejected until the repo is public or
        # GHAS-enabled. The real gate is the blocking scan below.
        if: always() && needs.changes.outputs.backend == 'true' && hashFiles('trivy-backend-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend
      - name: Upload Trivy frontend SARIF
        if: always() && needs.changes.outputs.frontend == 'true' && hashFiles('trivy-frontend-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend

      # ── Pass 2: Blocking gates (HIGH/CRITICAL only) ──
      - name: Trivy backend image gate (HIGH + CRITICAL block)
        if: needs.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: alga-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore
      - name: Trivy frontend image gate (HIGH + CRITICAL block)
        if: needs.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: alga-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore

  # ─────────────────────────────── Source & dependency scanning ──────────
  # govulncheck + gosec + betterleaks + pnpm audit scan source and dependencies,
  # not container images, so they run in parallel with the docker job above.
  # Individual scanners are gated on the relevant area (Go vs frontend).
  security-scan:
    name: Security · Vuln + Secret Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # full history so betterleaks can scan all commits on PR events
          fetch-depth: 0

      # ── Go vulnerability database scan (govulncheck) ──
      # Reports vulnerabilities reachable from the call graph. Fails CI on
      # confirmed findings (ASVS V14).
      # No cache-dependency-path here: govulncheck-action manages its own
      # module cache. A second restore over setup-go's read-only files makes
      # tar abort with "Cannot open: File exists".
      - name: Setup Go
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        if: needs.changes.outputs.backend == 'true'
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-version-input: ${{ env.GO_VERSION }}
          work-dir: ./apps/backend
          cache-dependency-path: apps/backend/go.sum

      # ── gosec: Go static analysis security scanner ──
      # Fail on High/Critical; surface findings as annotations. Installed
      # natively (not via the securego/gosec Docker action) so it builds
      # against this job's GO_VERSION toolchain — the action's pinned image
      # bundles an older Go that cannot load the `go 1.27.0` floor in go.work
      # under GOTOOLCHAIN=local.
      - name: gosec
        if: needs.changes.outputs.backend == 'true'
        working-directory: apps/backend
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          gosec -severity high -confidence medium ./...

      # ── betterleaks: detect secrets committed to the repo ──
      # Always runs (secrets can land in any file type). Installed from the
      # SHA-256-verified upstream release instead of a third-party action;
      # .betterleaks.toml at the repo root is picked up automatically.
      - name: betterleaks
        env:
          BETTERLEAKS_VERSION: v1.7.4
        run: |
          base_url="https://github.com/betterleaks/betterleaks/releases/download/${BETTERLEAKS_VERSION}"
          asset="betterleaks_${BETTERLEAKS_VERSION#v}_linux_x64"
          curl -sSfL -o "${asset}.tar.gz" "${base_url}/${asset}.tar.gz"
          curl -sSfL -o checksums.txt "${base_url}/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar xzf "${asset}.tar.gz" betterleaks
          ./betterleaks git . --git-workers 8

      # ── pnpm audit: frontend dependency CVEs ──
      - name: Setup pnpm
        if: needs.changes.outputs.frontend == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b  # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - name: Setup Node
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Frontend dependency audit
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/frontend
        # --prod scopes to production deps; --audit-level=high fails only on
        # high/critical advisories so low/info findings don't block merges.
        run: pnpm audit --prod --audit-level=high

  # ─────────────────────────────── Docs ───────────────────────────────────
  # Lints markdown and validates the VitePress build (catches broken links,
  # bad frontmatter, config errors). Fires on docs-only PRs so the gate is
  # active without triggering the full code pipeline.
  docs:
    name: Docs · Lint & Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b  # v2.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint markdown
        run: pnpm lint
      - name: Format check (oxfmt)
        run: pnpm format
      - name: VitePress build
        run: pnpm build

  # ─────────────────────────────── Hermes plugin: pytest ────────────────
  # The Hermes agent plugin ships its own Python test suite (pytest, no
  # Hermes runtime needed — the tests stub the gateway modules). Runs only
  # when plugin files change so docs/backend/frontend PRs don't pay for it.
  plugin-tests:
    name: Plugin · Pytest
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.plugin == 'true'
    defaults:
      run:
        working-directory: integrations/alga-hermes-agent-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/alga-hermes-agent-plugin/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run pytest
        run: python -m pytest tests/ -v
