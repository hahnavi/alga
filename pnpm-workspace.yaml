packages:
  - apps/*
  - docs
allowBuilds:
  esbuild: true

# Supply-chain cooldown: reject lockfile entries newer than 24h. CI runs
# `pnpm install --frozen-lockfile`, which enforces this gate. Keep the value
# (in minutes) in sync with minimumReleaseAge in renovate.json5 — Renovate
# cannot read pnpm's setting and pnpm cannot read Renovate's.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/node@26.0.1'

overrides:
  "@ungap/structured-clone": "^1.3.1"
  # GHSA-2v37-7h3g-55p8: nanoid custom generators can loop indefinitely when
  # size is zero. postcss (via vue > @vue/compiler-sfc) still pins ^3.3.17, so
  # force the patched 3.x release. Stay within major 3 — nanoid >=4 is ESM-only
  # and postcss 8 requires the CJS build.
  "nanoid@<3.3.18": "6.0.2"
  # GHSA-gfr2-rv44-r23c and the related markdown-it quadratic-parsing
  # advisories. tiptap-markdown and prosemirror-markdown resolve the 14.x
  # line; the frontend pins 15.x directly.
  "markdown-it@<15": "^15.0.0"
  # ProseMirror paste-handler XSS (GHSA-*) and source-map-js event-loop DoS
  # (GHSA-*) reach the frontend through @tiptap and the Vue compiler toolchain.
  "prosemirror-view@<1.42.3": "^1.42.3"
  "source-map-js@<1.2.2": "^1.2.2"
