{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "alga.fullname" . }}
  labels:
    {{- include "alga.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if hasPrefix "/" .path | and (ne .path "/api") | and (ne .path "/webhooks") | and (ne .path "/metrics") }}
                name: {{ include "alga.fullname" $ }}-frontend
                {{- else }}
                name: {{ include "alga.fullname" $ }}-backend
                {{- end }}
                port:
                  number: 80
          {{- end }}
    {{- end }}
{{- end }}
