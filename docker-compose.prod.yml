services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    # Container hardening (ASVS V11.3, SPEC gap L3): drop all capabilities,
    # forbid privilege escalation, and run read-only where the image allows.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set POSTGRES_PASS in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    restart: always
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    restart: always
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    ports: !override []
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - SESSION_EXPIRY_HOURS=${SESSION_EXPIRY_HOURS:-24}
      - ENCRYPTION_KEYS=${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS in .env}
      - SECRET_PEPPER=${SECRET_PEPPER:?set SECRET_PEPPER in .env}
      - POSTGRES_PASS=${POSTGRES_PASS:?set POSTGRES_PASS in .env}
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?set RABBITMQ_PASS in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    ports: !override []
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
