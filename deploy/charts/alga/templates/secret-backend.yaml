apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alga.fullname" . }}-backend
  labels:
    {{- include "alga.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.backend.secrets }}
  {{- if .encryptionKeys }}
  ENCRYPTION_KEYS: {{ .encryptionKeys | b64enc | quote }}
  {{- end }}
  {{- if .secretPepper }}
  SECRET_PEPPER: {{ .secretPepper | b64enc | quote }}
  {{- end }}
  {{- if .postgresDSN }}
  POSTGRES_DSN: {{ .postgresDSN | b64enc | quote }}
  {{- end }}
  {{- if .valkeyAddr }}
  VALKEY_ADDR: {{ .valkeyAddr | b64enc | quote }}
  {{- end }}
  {{- if .valkeyPassword }}
  VALKEY_PASSWORD: {{ .valkeyPassword | b64enc | quote }}
  {{- end }}
  {{- if .rabbitmqURI }}
  RABBITMQ_URI: {{ .rabbitmqURI | b64enc | quote }}
  {{- end }}
  {{- end }}
