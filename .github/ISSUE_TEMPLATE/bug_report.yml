name: Bug Report
description: Report a bug in Alga
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Alga Version
      description: What version of Alga are you running?
      placeholder: e.g. v0.1.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      description: How are you running Alga?
      options:
        - Docker Compose
        - Kubernetes
        - Manual
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output.
      render: shell
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Any relevant configuration details (please redact secrets).
      placeholder: Please redact secrets
      render: yaml
    validations:
      required: false
