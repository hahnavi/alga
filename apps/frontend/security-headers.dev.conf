# Alga SPA security headers — DEVELOPMENT ONLY.
#
# Use this in your local dev nginx reverse proxy (the one in front of
# `pnpm run dev` / Vite :5173). It is identical to security-headers.conf
# except that script-src grants 'unsafe-eval', which Vite requires for HMR
# and source-map handling (esbuild transforms via `new Function`).
#
# Usage in your dev nginx:
#   location / { include /path/to/security-headers.dev.conf; try_files ... }
#
# DO NOT ship this in production. The production Docker image uses
# security-headers.conf (script-src 'self', no eval). Keep the two files in
# sync for every directive except script-src. If you add/remove a header or
# tighten/loosen a source list in one, mirror it here.

# X-Content-Type-Options: block MIME sniffing (ASVS V12.4 / Gresto 32.29).
add_header X-Content-Type-Options "nosniff" always;

# X-Frame-Options: legacy clickjacking defense (CSP frame-ancestors is the
# modern control and is set below).
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer-Policy: limit leakage of the URL to cross-origin destinations
# (ASVS V12.4 / Gresto 32.29).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy: disable every browser feature the SPA does not use. The
# incident-management UI needs none of the camera/mic/geo/location/USB/payment
# surfaces, so they are all switched off (Gresto 32.29).
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), browsing-topics=(), interest-cohort=()" always;

# Content-Security-Policy (dev variant). Identical to security-headers.conf
# except:
#   - script-src 'self' 'unsafe-eval': Vite dev server uses eval for HMR and
#     inline source maps. Production builds bundle everything and do not need
#     'unsafe-eval'; see security-headers.conf.
# Everything else mirrors the production policy so the dev environment stays
# otherwise strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# HSTS: emit only when the request arrived over TLS, including via a trusted
# reverse proxy that sets X-Forwarded-Proto. Local dev usually runs over plain
# HTTP, in which case this is a no-op. Kept for parity with the production
# policy.
#
# The value comes from the http-scope `map` in hsts-map.conf (empty unless
# X-Forwarded-Proto is "https"). A `map` is used instead of an `if` block
# because `if` + `add_header` makes nginx drop every sibling `add_header` in
# this file when the condition matches. Your dev reverse proxy must define the
# map at http scope, e.g. inside your http {} block:
#   include /path/to/hsts-map.conf;
add_header Strict-Transport-Security $strict_transport_security always;
