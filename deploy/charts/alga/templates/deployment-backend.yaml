apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alga.fullname" . }}-backend
  labels:
    {{- include "alga.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "alga.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "alga.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.config.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "alga.fullname" . }}-backend
            - secretRef:
                name: {{ include "alga.fullname" . }}-backend
                optional: true
          {{- if or .Values.postgresql.enabled .Values.valkey.enabled .Values.rabbitmq.enabled }}
          # Explicit env entries take precedence over envFrom, so bundled
          # services win over any external values in backend.secrets.
          env:
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "alga.fullname" . }}-postgresql
                  key: backend-dsn
            {{- end }}
            {{- if .Values.valkey.enabled }}
            - name: VALKEY_ADDR
              value: {{ printf "%s-valkey:6379" (include "alga.fullname" .) | quote }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "alga.fullname" . }}-valkey
                  key: password
            {{- end }}
            {{- if .Values.rabbitmq.enabled }}
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "alga.fullname" . }}-rabbitmq
                  key: backend-uri
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
