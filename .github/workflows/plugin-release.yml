# Plugin release workflow — builds the Mattermost plugin bundle and attaches
# it to the GitHub Release as a downloadable asset. Triggered by `v*` tags
# (same trigger as release.yml), runs in parallel with it.
#
# The plugin is NOT bundled into any Docker image by default. Deployments that
# need the in-cluster auto-install flow (GET /internal/mm-plugin serving this
# tarball to the alga-plugin-ensure CronJob) download this asset and mount it
# into the backend container at /app/plugins/ — renaming it back to
# com.alga.mattermost-plugin-0.0.1.tar.gz, the filename pinned by the backend
# handler — or bake it into a derived image with:
# docker build --target with-mm-plugin -f apps/backend/Dockerfile .
name: Plugin Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # attach the bundle to the GitHub Release

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local

jobs:
  meta:
    name: Plugin · Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Parse SemVer tag
        id: semver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! echo "$TAG" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "error: '$TAG' is not valid SemVer" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build-bundle:
    name: Plugin · Build & Attach Bundle
    runs-on: ubuntu-latest
    needs: [meta]
    defaults:
      run:
        working-directory: integrations/alga-mattermost-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: integrations/alga-mattermost-plugin/go.sum
      # GOWORK=off builds from the plugin's standalone module, not the
      # workspace — matches the plugin's own Makefile.
      - name: Build plugin bundle
        env:
          GOWORK: "off"
        run: make bundle
      # make bundle produces dist/com.alga.mattermost-plugin-0.0.1.tar.gz.
      # Tag it with the release version so deployments can pin to it; note
      # that /internal/mm-plugin keeps serving the pinned -0.0.1.tar.gz name
      # (see apps/backend/api/chat_integration.go), so mounts must rename.
      - name: Version-stamp the bundle
        run: |
          mv "dist/com.alga.mattermost-plugin-0.0.1.tar.gz" \
             "dist/com.alga.mattermost-plugin-${{ needs.meta.outputs.version }}.tar.gz"
      - name: Attach bundle to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          # generate_release_notes appends to the existing release body; we
          # only want to attach the file, not rewrite notes.
          generate_release_notes: false
          files: |
            integrations/alga-mattermost-plugin/dist/com.alga.mattermost-plugin-${{ needs.meta.outputs.version }}.tar.gz
