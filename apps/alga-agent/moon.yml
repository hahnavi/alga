language: go

tasks:
  build:
    command: go build -ldflags '-s -w' -o alga-agent .
  vet:
    command: go vet ./...
  format:
    command: gofmt -l .
  format-write:
    command: gofmt -w .
    options:
      runInCI: false
  test:
    command: go test ./...
  test-e2e:
    command: go test ./e2e/... -v -timeout 10m -count=1
    env:
      ALGA_AGENT_E2E: '1'
    options:
      runInCI: false
  run:
    command: go run .
    options:
      runInCI: false
      persistent: true
