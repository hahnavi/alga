# Conditional HSTS via `map` (http scope), not `if`.
#
# nginx's `if` combined with `add_header` drops sibling `add_header`
# directives when the condition matches (the "if is evil" pitfall): on HTTPS
# requests every other security header (CSP, X-Content-Type-Options, ...) would
# vanish. `if` is also not valid at http scope. A `map` avoids both: the
# variable is the HSTS value over HTTPS and empty otherwise, so the single
# `add_header Strict-Transport-Security $strict_transport_security always;` in
# security-headers.conf emits the header only on TLS and never blanks the other
# headers.
#
# This file MUST be loaded at http scope. In the Docker image it is copied to
# /etc/nginx/conf.d/ and auto-included by the stock nginx.conf. For the dev
# reverse proxy, `include` it inside your http {} block (see
# security-headers.dev.conf).
map $http_x_forwarded_proto $strict_transport_security {
    default "";
    https   "max-age=63072000; includeSubDomains; preload";
}
