<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alga on-call and incident management" />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      The Content-Security-Policy is delivered exclusively via the response
      header (rendered from security-headers.conf.template at container
      startup, extendable per deployment through env vars / Helm values).
      Do NOT add a CSP <meta> tag here: browsers
      enforce the intersection of every policy present, so a meta tag would
      make deploy-time adjustments (e.g. allowing a CDN-injected analytics
      script) impossible without rebuilding the image. The dev server injects
      its own relaxed meta CSP via the alga-csp-dev plugin in vite.config.ts.
    -->
    <title>Alga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This application requires JavaScript to run.</noscript>
    <script src="/zod-jitless.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
