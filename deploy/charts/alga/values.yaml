backend:
  image:
    repository: ghcr.io/hahnavi/alga-backend
    tag: v0.0.2
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: "1"
  config:
    port: 8080
    logLevel: info
    environment: production
    sessionExpiryHours: 24
    postgresAutoMigrate: true
  secrets:
    # Comma-separated `kid:base64(32-byte key)` pairs, e.g. "1:<base64-32B>".
    # Generate a key with: openssl rand -base64 32
    encryptionKeys: ""
    secretPepper: ""
    postgresDSN: ""
    valkeyAddr: ""
    valkeyPassword: ""
    rabbitmqURI: ""

frontend:
  image:
    repository: ghcr.io/hahnavi/alga-frontend
    tag: v0.0.2
    pullPolicy: IfNotPresent
  replicas: 1
  # Content-Security-Policy additions for the SPA. The image ships a strict
  # policy (script-src 'self'); these lists are passed to the container as
  # ALGA_CSP_SCRIPT_SRC_EXTRA / ALGA_CSP_CONNECT_SRC_EXTRA and appended to
  # script-src / connect-src when nginx renders its config at startup.
  # Needed when a proxy/CDN in front of Alga injects scripts into the page.
  # Example for Cloudflare Web Analytics:
  #   csp:
  #     scriptSrcExtra: ["https://static.cloudflareinsights.com"]
  #     connectSrcExtra: ["https://cloudflareinsights.com"]
  # Note: Cloudflare Rocket Loader rewrites module scripts and requires
  # 'unsafe-eval'; prefer disabling Rocket Loader for the Alga host instead
  # of weakening script-src.
  csp:
    scriptSrcExtra: []
    connectSrcExtra: []
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: alga.example.com
      paths:
        - path: /api
          pathType: Prefix
        - path: /webhooks
          pathType: Prefix
        - path: /metrics
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls:
    - secretName: alga-tls
      hosts:
        - alga.example.com

# ── Bundled data services ────────────────────────────────────────────────
# Each service below is deployed by this chart when `enabled: true`.
# To use an externally managed instance instead, set `enabled: false` and
# provide the matching connection settings under backend.secrets
# (postgresDSN, valkeyAddr/valkeyPassword, rabbitmqURI).
# When a bundled service is enabled, its auth.password must be set to a
# pinned value; installs fail otherwise. Pinned passwords keep renders
# deterministic and stay valid across upgrades and retained volumes.

postgresql:
  enabled: true
  # pgvector-enabled image; the backend startup migration requires the
  # `vector` extension.
  image:
    repository: pgvector/pgvector
    tag: pg17
    pullPolicy: IfNotPresent
  auth:
    username: alga
    password: ""
    database: alga
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
  resources: {}

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 9-alpine
    pullPolicy: IfNotPresent
  auth:
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  resources: {}

rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 4-alpine
    pullPolicy: IfNotPresent
  auth:
    username: alga
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  resources: {}
